name: Call backend deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || vars.DEPLOY_ON_PUSH == 'true'
    runs-on: [self-hosted, qimerp-ci]
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          repository: iamqwame/qimerp-infra
          ref: main
          token: ${{ secrets.CHECKOUT_TOKEN }}

      - name: Publish the proxy scope
        env:
          CALLER_SHA: ${{ github.sha }}
          CALLER_SCOPE: proxy
          PUSH_ROUTE: ${{ vars.DEPLOY_ROUTE }}
          BAREMETAL_SSH_KEY: ${{ secrets.BAREMETAL_DEPLOY_SSH_KEY }}
          DOCKER_SSH_KEY: ${{ secrets.PRODUCTION_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
          CHECKOUT_TOKEN: ${{ secrets.CHECKOUT_TOKEN }}
        run: |
          set -euo pipefail
          export GITHUB_OUTPUT
          GITHUB_OUTPUT="$(mktemp)"
          bash scripts/resolve-backend-deploy.sh
          route="$(sed -n 's/^route=//p' "$GITHUB_OUTPUT" | head -n 1)"
          sha="$(sed -n 's/^sha=//p' "$GITHUB_OUTPUT" | head -n 1)"
          services="$(awk 'f{if(/^EOF$/){exit} print} /^services<<EOF$/{f=1}' "$GITHUB_OUTPUT")"
          case "$route" in
            "Bare metal on the runtime box")
              export SHA="$sha"
              export SSH_KEY="${BAREMETAL_SSH_KEY}"
              python3 -c 'import json,sys; print("\n".join(json.loads(sys.stdin.read())))' <<<"$services" |
                while IFS= read -r service; do
                  [[ -n "$service" ]] || continue
                  SERVICE="$service" bash scripts/gha-bare-metal-one.sh
                done
              ;;
            "Docker on the runtime box")
              SSH_KEY="${DOCKER_SSH_KEY}" SERVICES="$services" bash scripts/gha-docker-deploy.sh
              ;;
            *)
              echo "template returned an unknown route" >&2
              exit 1
              ;;
          esac
