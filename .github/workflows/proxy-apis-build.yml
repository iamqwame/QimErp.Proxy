name: Build & Push Proxy APIs to GitHub Container Registry

on:
  push:
    branches: [main]
    paths:
      - 'src/Modules/**'
      - 'Directory.*.props'
      - '.github/scripts/**'
      - '.github/workflows/proxy-apis-build.yml'
  workflow_dispatch:
    inputs:
      services:
        description: 'Space-separated images to build (mobile); empty builds all'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io

concurrency:
  group: qimerp-ci-proxy-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    name: Select images
    runs-on: [self-hosted, qimerp-ci]
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Select affected images
        id: select
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          SERVICES: ${{ inputs.services }}
          CATALOGUE: |
            [
              {"service": "mobile", "project": "src/Modules/Mobile/QimErp.Proxy.Mobile.WebApi/QimErp.Proxy.Mobile.WebApi.csproj", "image": "qimerp-proxy-mobile-api"}
            ]
        run: |
          set -euo pipefail
          base=""
          if [ "$EVENT" = "push" ]; then base="$BEFORE"; fi
          affected="$(python3 .github/scripts/affected.py --base "$base" --head "$SHA" \
            --roots 'src/Modules/*/*.WebApi/*.WebApi.csproj' \
            --always .github/workflows/proxy-apis-build.yml)"
          matrix="$(AFFECTED="$affected" python3 .github/scripts/select-images.py)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Images to build: $matrix"

  test:
    name: Test
    needs: [changes]
    if: needs.changes.outputs.matrix != '[]'
    runs-on: [self-hosted, qimerp-ci]
    timeout-minutes: 45
    env:
      MSBUILDDISABLENODEREUSE: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install .NET 9 (user-local on Contabo)
        run: |
          set -euo pipefail
          INSTALL_DIR="${HOME}/.dotnet"
          has_sdk() { "${INSTALL_DIR}/dotnet" --list-sdks 2>/dev/null | grep '^9\.0\.' >/dev/null; }
          if ! has_sdk; then
            exec 9>"${HOME}/.dotnet-install.lock"
            flock 9
            if ! has_sdk; then
              installer="$(mktemp -p "${RUNNER_TEMP}" dotnet-install.XXXXXX)"
              curl -fsSL https://dot.net/v1/dotnet-install.sh -o "${installer}"
              bash "${installer}" --channel 9.0 --install-dir "${INSTALL_DIR}"
              rm -f "${installer}"
            fi
            flock -u 9
          fi
          echo "${INSTALL_DIR}" >> "${GITHUB_PATH}"
          echo "DOTNET_ROOT=${INSTALL_DIR}" >> "${GITHUB_ENV}"
          "${INSTALL_DIR}/dotnet" --info

      - name: Restore dependencies
        run: |
          dotnet restore src/Modules/Mobile/QimErp.Proxy.Mobile.WebApi/QimErp.Proxy.Mobile.WebApi.csproj
          dotnet restore src/Modules/Mobile/QimErp.Proxy.Mobile.WebApi.Tests/QimErp.Proxy.Mobile.WebApi.Tests.csproj

      - name: Build
        run: |
          dotnet build src/Modules/Mobile/QimErp.Proxy.Mobile.WebApi.Tests/QimErp.Proxy.Mobile.WebApi.Tests.csproj -c Release --no-restore -m:3 -nodeReuse:false -p:UseSharedCompilation=false

      - name: Test
        run: |
          dotnet test src/Modules/Mobile/QimErp.Proxy.Mobile.WebApi.Tests/QimErp.Proxy.Mobile.WebApi.Tests.csproj -c Release --no-build --verbosity normal

  build:
    name: Build & Push ${{ matrix.service }}
    needs: [changes, test]
    if: needs.changes.outputs.matrix != '[]'
    runs-on: [self-hosted, qimerp-ci]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # The docker driver keeps layers warm in the host daemon but cannot store attestations (provenance/sbom off below).
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1
        with:
          driver: docker

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@369eb591f429131d6889c46b94e711f089e6ca96 # v5.6.1
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: push
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8 # v0.28.0
        continue-on-error: true
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:latest
          format: sarif
          output: trivy-results.sarif
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@4b6aa0b07da05d6e43d0e5f9c8596a6532ce1c85 # v3.27.4
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif

      - name: Summary
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
        run: |
          {
            echo "### ${IMAGE}:latest"
            echo "Production deploys: run the 'Proxy Deploy (Production)' workflow from main."
          } >> "$GITHUB_STEP_SUMMARY"
